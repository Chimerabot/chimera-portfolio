<!DOCTYPE html>
<html>
    <head>  <!-- Contains some basic information about the webpage. -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="author" content="Chimerabot / Gideon Rank">
        <title>chimera-portfolio</title>
        <link href="/style/style.css" rel="stylesheet" type="text/css" media="all">
            <link href="/style/components.css" rel="stylesheet" type="text/css" media="all">
            <link href="/style/constants.css" rel="stylesheet" type="text/css" media="all">
    </head>

    <div id="fragment-header" aria-hidden="true"></div>
    <div id="fragment-body" aria-hidden="true"></div>
    <div id="fragment-footer" aria-hidden="true"></div>

    <!-- Below is basic JavaScript code that loads each of the above pieces of the webpage, so they can be easily
    edited in their individual files. This code handles all of the placement of the content. -->

    <script>
      async function loadFragment(id, url) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
          document.getElementById(id).innerHTML = await res.text();
        } catch (e) {
          console.error('Error loading fragment: ', url, e);
        }
      }

      // These files below are all the individual components of the webpage. You can add more pieces if you'd like, 
      // or simply modify the files that are already there - this file loads them in automatically!

      document.addEventListener('DOMContentLoaded', function() {
        loadFragment('fragment-header', '/fragments/header.html');
        loadFragment('fragment-body', '/fragments/body.html');
        loadFragment('fragment-footer', '/fragments/footer.html');
      });
    </script>
</html>
